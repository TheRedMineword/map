<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Terminal Log Viewer</title>

<style>
  body {
    margin: 0;
    background: #000;
    color: #0f0;
    font-family: monospace;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  #status {
    padding: 6px 10px;
    font-size: 12px;
    background: #111;
    color: #aaa;
    border-bottom: 1px solid #222;
  }

  #terminal {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    white-space: pre-wrap;   /* ✅ wrap lines */
    word-break: break-word;  /* ✅ prevent overflow */
    font-size: 13px;
    line-height: 1.4;
  }

  .line {
    margin: 0;
  }

  .time {
    color: #666;
  }
</style>
</head>

<body>

<div id="status">Connecting...</div>
<div id="terminal"></div>

<script type="module">
import { XanoClient } from "https://cdn.skypack.dev/@xano/js-sdk";

const instanceBaseUrl = "https://x8ki-letl-twmt.n7.xano.io/";
const realtimeConnectionHash = "0tOCKMg89plUCqKuBgdfTDuCpww";
const channelName = "console_log";

const statusEl = document.getElementById("status");
const termEl = document.getElementById("terminal");

const MAX_LINES = 500; // prevent memory issues

function now() {
  return new Date().toISOString().slice(11, 23);
}

function setStatus(msg) {
  statusEl.textContent = msg;
}

function appendLine(text) {
  const div = document.createElement("div");
  div.className = "line";

  div.innerHTML = `<span class="time">[${now()}]</span> ${escapeHtml(text)}`;
  termEl.appendChild(div);

  // limit lines
  while (termEl.children.length > MAX_LINES) {
    termEl.removeChild(termEl.firstChild);
  }

  // auto-scroll
  termEl.scrollTop = termEl.scrollHeight;
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

try {
  const client = new XanoClient({
    instanceBaseUrl,
    realtimeConnectionHash,
  });

  const channel = client.channel(channelName);

  channel.on((action) => {
    const payload = action?.payload;

    if (payload?.data !== undefined) {
      appendLine(payload.data);
    } else {
      appendLine("(no payload data)");
    }
  });

  setStatus("Connected to realtime channel.");
} catch (e) {
  setStatus("Connection error: " + e.message);
  appendLine("ERROR: " + e.message);
}
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Procedural Space</title>
<style>
  body,html { margin:0; overflow:hidden; background:black; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
const params = new URLSearchParams(location.search);
const LOG = params.get("console_log") === "true";
const storageKey = params.get("localstoragekey")?.split(".")[0];
const field = params.get("localstoragekey")?.split(".")[1];

function log(...a){ if(LOG) console.log("[SPACE]",...a); }

// ---- Load Camera POV ----
let cam = { px:0, py:0, pz:0, rx:0, ry:0, rz:0, zoom:1 };
let lastCamJSON = JSON.stringify(cam);

try {
  const raw = localStorage.getItem(storageKey);
  if(raw){
    const parsed = JSON.parse(raw);
    cam = parsed[field];
    lastCamJSON = JSON.stringify(cam);
    log("Camera loaded", cam);
  }
} catch(e){ log("Storage error", e); }

// ---- WebGL Setup ----
const canvas = document.getElementById("c");
const gl = canvas.getContext("webgl");
canvas.width = innerWidth;
canvas.height = innerHeight;
gl.viewport(0,0,canvas.width,canvas.height);

// ---- Shaders ----
const vert = `
attribute vec2 p;
void main(){ gl_Position = vec4(p,0.,1.); }
`;

  
const frag = `
precision highp float;

uniform float u_time;
uniform vec2 u_res;
uniform vec3 camPos;
uniform vec3 camRot;

float hash(vec3 p){
  p = fract(p * 0.3183099 + .1);
  p *= 17.0;
  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}

float noise(vec3 x){
  vec3 i = floor(x);
  vec3 f = fract(x);
  f = f*f*(3.0-2.0*f);
  float n = mix(mix(mix(hash(i), hash(i+vec3(1,0,0)), f.x),
                    mix(hash(i+vec3(0,1,0)), hash(i+vec3(1,1,0)), f.x), f.y),
                mix(mix(hash(i+vec3(0,0,1)), hash(i+vec3(1,0,1)), f.x),
                    mix(hash(i+vec3(0,1,1)), hash(i+vec3(1,1,1)), f.x), f.y), f.z);
  return n;
}

float fbm(vec3 p){
  float f=0.0;
  f+=noise(p)*.5; p*=2.0;
  f+=noise(p)*.25; p*=2.0;
  f+=noise(p)*.125;
  return f;
}

mat3 rotY(float a){ return mat3(cos(a),0.,sin(a), 0.,1.,0., -sin(a),0.,cos(a)); }
mat3 rotX(float a){ return mat3(1.,0.,0., 0.,cos(a),-sin(a), 0.,sin(a),cos(a)); }

void main(){
  vec2 uv = (gl_FragCoord.xy*2.0 - u_res)/u_res.y;
  vec3 ray = normalize(vec3(uv, 1.5));

  ray = rotY(camRot.y) * rotX(camRot.x) * ray;

  // March through space
  vec3 p = camPos;
  float density = 0.0;
  for(int i=0;i<6;i++){
    p += ray * 8.0;
    density += fbm(p*0.02);
  }
  density /= 6.0;

  vec3 nebColor = vec3(0.2,0.3,0.6) * density * density;

  // Stars in world space
  vec3 starPos = camPos + ray * 200.0;
  float star = step(0.9997, hash(floor(starPos*2.0)));

  vec3 col = nebColor + vec3(star);
  gl_FragColor = vec4(col,1.0);
}
`;

// ---- Compile ----
function C(t,s){let sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);return sh;}
const prog=gl.createProgram();
gl.attachShader(prog,C(gl.VERTEX_SHADER,vert));
gl.attachShader(prog,C(gl.FRAGMENT_SHADER,frag));
gl.linkProgram(prog);
gl.useProgram(prog);

const buf=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(prog,"p");
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);

const u_time=gl.getUniformLocation(prog,"u_time");
const u_res=gl.getUniformLocation(prog,"u_res");
const u_camPos=gl.getUniformLocation(prog,"camPos");
const u_camRot=gl.getUniformLocation(prog,"camRot");

let start=Date.now()/1000;

// ---- Update camera from storage ----
function updateCameraFromStorage(trigger){
  try{
    const raw = localStorage.getItem(storageKey);
    if(!raw) return;
    const parsed = JSON.parse(raw);
    const newCam = parsed[field];
    if(!newCam) return;

    const newJSON = JSON.stringify(newCam);
    if(newJSON !== lastCamJSON){
      cam = newCam;
      lastCamJSON = newJSON;
      if(LOG){
        console.log("[SPACE] Camera updated via", trigger, {
          px: cam.px, py: cam.py, pz: cam.pz,
          rx: cam.rx, ry: cam.ry, rz: cam.rz
        });
      }
    }
  } catch(e){
    if(LOG) console.log("[SPACE] Storage read error", e);
  }
}

// ---- Listen for cross-page updates ----
window.addEventListener("storage", (e)=>{
  if(e.key === storageKey){
    updateCameraFromStorage("storage-event");
  }
});

// ---- Polling to catch same-page updates ----
setInterval(()=>{
  updateCameraFromStorage("polling");
}, 50);

// ---- Render Loop ----
function draw(){
  let t=Date.now()/1000-start;
  gl.uniform1f(u_time,t);
  gl.uniform2f(u_res,canvas.width,canvas.height);
  gl.uniform3f(u_camPos,cam.px,cam.py,cam.pz);
  gl.uniform3f(u_camRot,cam.rx,cam.ry,cam.rz);

  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>

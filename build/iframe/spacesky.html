<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Cinematic Procedural Space</title>
<style>
  body,html { margin:0; overflow:hidden; background:black; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
// ---- CAMERA ----
let cam = { px:0, py:0, pz:0, rx:0, ry:0, rz:0 };

// TEMP movement (remove later)
setInterval(()=> cam.pz += 0.15, 16);

// ---- WEBGL ----
const canvas = document.getElementById("c");
const gl = canvas.getContext("webgl");

function resize(){
  canvas.width = innerWidth;
  canvas.height = innerHeight;
  gl.viewport(0,0,canvas.width,canvas.height);
}
resize();
window.addEventListener("resize", resize);

// ---- SHADERS ----
const vert = `
attribute vec2 p;
void main(){ gl_Position = vec4(p,0.,1.); }
`;

const frag = `
precision highp float;

uniform vec2 u_res;
uniform vec3 camPos;
uniform vec3 camRot;

// ---- HASH ----
float hash(vec3 p){
  p = fract(p * 0.3183099 + .1);
  p *= 17.0;
  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}

// ---- NOISE ----
float noise(vec3 x){
  vec3 i = floor(x);
  vec3 f = fract(x);
  f = f*f*(3.0-2.0*f);

  float n = mix(mix(mix(hash(i), hash(i+vec3(1,0,0)), f.x),
                    mix(hash(i+vec3(0,1,0)), hash(i+vec3(1,1,0)), f.x), f.y),
                mix(mix(hash(i+vec3(0,0,1)), hash(i+vec3(1,0,1)), f.x),
                    mix(hash(i+vec3(0,1,1)), hash(i+vec3(1,1,1)), f.x), f.y), f.z);
  return n;
}

// ---- FBM ----
float fbm(vec3 p){
  float f=0.0;
  f+=noise(p)*.5; p*=2.0;
  f+=noise(p)*.25; p*=2.0;
  f+=noise(p)*.125;
  return f;
}

// ---- ROT ----
mat3 rotY(float a){ return mat3(cos(a),0.,sin(a), 0.,1.,0., -sin(a),0.,cos(a)); }
mat3 rotX(float a){ return mat3(1.,0.,0., 0.,cos(a),-sin(a), 0.,sin(a),cos(a)); }

// ---- NEBULA BLOBS ----
float nebulaBlob(vec3 p){
  vec3 cell = floor(p * 0.04);
  float h = hash(cell);

  if(h < 0.55) return 0.0;

  float size = mix(0.3, 0.8, hash(cell + 1.0));

  vec3 local = fract(p * 0.04) - 0.5;
  float d = length(local);

  return smoothstep(size, 0.0, d);
}

// ---- GALAXY ----
float galaxy(vec3 p){
  float r = length(p.xy);
  float angle = atan(p.y, p.x);

  float arms = sin(angle * 4.0 + r * 2.5);
  float core = exp(-r * 0.25);

  return core + arms * 0.6;
}

void main(){
  vec2 uv = (gl_FragCoord.xy*2.0 - u_res)/u_res.y;

  vec3 ray = normalize(vec3(uv, 1.2));
  ray = rotY(camRot.y) * rotX(camRot.x) * ray;

  vec3 ro = camPos;
  vec3 rd = ray;

  float density = 0.0;

  for(int i=0;i<10;i++){
    float t = float(i) * 10.0;
    vec3 p = ro + rd * t;

    float blob = nebulaBlob(p);
    float g = galaxy(p * 0.02);

    density += fbm(p * 0.01) * blob * g * 2.5;
  }

  density /= 10.0;

  // ---- VISIBILITY BOOST ----
  density = smoothstep(0.15, 0.8, density);
  density = pow(density, 0.6);

  // ---- CINEMATIC COLOR ----
  vec3 col = vec3(0.0);

  // deep space base
  col += vec3(0.05,0.08,0.15) * density;

  // purple / blue
  col += vec3(0.4,0.2,0.9) * pow(density,1.5);

  // warm glow (important!)
  col += vec3(1.0,0.5,0.2) * pow(density,3.0);

  // pink accents
  col += vec3(0.8,0.3,0.6) * pow(density,2.0);

  // emission glow
  col += density * 0.25;

  // ---- STARS (stable) ----
  vec3 starPos = ro + rd * 300.0;
  vec3 cell = floor(starPos * 0.5);

  float star = hash(cell);
  star = step(0.995, star);

  col += vec3(star);

  gl_FragColor = vec4(col,1.0);
}
`;

// ---- COMPILE ----
function C(t,s){
  let sh=gl.createShader(t);
  gl.shaderSource(sh,s);
  gl.compileShader(sh);
  return sh;
}

const prog=gl.createProgram();
gl.attachShader(prog,C(gl.VERTEX_SHADER,vert));
gl.attachShader(prog,C(gl.FRAGMENT_SHADER,frag));
gl.linkProgram(prog);
gl.useProgram(prog);

// ---- QUAD ----
const buf=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);

const loc=gl.getAttribLocation(prog,"p");
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);

// ---- UNIFORMS ----
const U = n => gl.getUniformLocation(prog,n);

// ---- LOOP ----
function draw(){
  gl.uniform2f(U("u_res"),canvas.width,canvas.height);
  gl.uniform3f(U("camPos"),cam.px,cam.py,cam.pz);
  gl.uniform3f(U("camRot"),cam.rx,cam.ry,cam.rz);

  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>

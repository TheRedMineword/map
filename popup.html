<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Popup Viewer</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f9f9f9;
    }
    #popup-box {
      padding: 20px;
      border-radius: 10px;
      background: white;
      max-width: 640px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
      border: 3px solid #000;
    }
    #popup-fulltext {
      line-height: 1.5;
    }
    video, audio {
      display: block;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div id="popup-box">
    <h2 id="popup-title"></h2>
    <div id="popup-fulltext"></div>
  </div>

  <script>
    const hashParams = new URLSearchParams(location.hash.slice(1));
    const title = decodeURIComponent(hashParams.get("title") || "");
    const fulltext = decodeURIComponent(hashParams.get("fulltext") || "");
    const outline = decodeURIComponent(hashParams.get("outline") || "#000");

function escapeHTML(str) {
  return str
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


    document.getElementById("popup-title").innerHTML = escapeHTML(title);
    document.getElementById("popup-box").style.borderColor = decodeURIComponent(outline);

    function safeMarkdownToHTML(md) {
      const escape = (str) => str.replace(/[&<>"]/g, ch =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch]);

      return  escapeHTML(md)
        // Headers
        .replace(/^### (.*$)/gim, '<h3>$1</h3>')
        .replace(/^## (.*$)/gim, '<h2>$1</h2>')
        .replace(/^# (.*$)/gim, '<h1>$1</h1>')

        // Lists
        .replace(/^- (.*)$/gim, '<li>$1</li>')
        .replace(/(<li>.*<\/li>)/gim, '<ul>$1</ul>')

        // Images
        .replace(/!\[file:([^\] ]*)(?:\s+style="([^"]*)")?\]\(([^)]+)\)/gim, (_, type, style, url) => {
          url = escape(url.trim());
          style = style ? `style="${escape(style)}"` : '';
          if (type === 'vid') {
            return `<video controls ${style}><source src="${url}"></video>`;
          } else if (type === 'audio') {
            return `<audio controls ${style}><source src="${url}"></audio>`;
          } if (type === 'img') {
            return `<img alt="${escape(type)}" src="${url}" ${style}/>`;
          } else {
            // default is image
            return `<img alt="${escape(type)}" src="${url}" ${style}/>`;
          }
        })

        // Hyperlinks
        .replace(/\[([^\]]+)\]\(([^)]+)\)/gim, '<a href="$2" target="_blank">$1</a>')

        // Paragraphs
        .replace(/\n{2,}/g, '</p><p>')
        .replace(/\n/g, '')
        .replace(/^(.+)$/gm, '<p>$1</p>'); // wrap all lines in <p>
    }


// Feature	Syntax	Output
// Headers	#, ##, ###	<h1>, <h2>, <h3>
// Lists	- item	<ul><li>item</li></ul>
// Links	[text](url)	<a>
// Images	![file:img style="..."](url)	<img>
// Videos	![file:vid style="..."](url)	<video>
// Audio	![file:audio style="..."](url)	<audio>
// Paragraphs	Double newline	<p>




    document.getElementById("popup-fulltext").innerHTML = safeMarkdownToHTML(fulltext);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Galaxy Map 2D Orbit + Spin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: sans-serif;
    }
    #infoBox {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 10px 15px;
      border-radius: 5px;
      font-size: 14px;
      max-width: 300px;
      display: none;
      pointer-events: none;
      user-select: none;
    }
    .label {
      color: white;
      background: rgba(0, 0, 0, 0.6);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
      pointer-events: none;
      user-select: none;
      white-space: nowrap;
      transform-origin: center center;
    }
    .clickable {
      cursor: pointer;
      pointer-events: auto;
    }
    #loadingOverlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.95);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2em;
      z-index: 9999;
      transition: opacity 0.4s;
    }
    #loadingOverlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #searchBox {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      padding: 10px;
      border-radius: 6px;
      color: #fff;
      z-index: 10;
      font-size: 14px;
      display: flex;
      gap: 6px;
      align-items: center;
    }
    #searchInput {
      padding: 4px;
      width: 200px;
      border: none;
      border-radius: 4px;
    }
    .searchBtn {
      background: #222;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 4px 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
<div id="loadingOverlay">Loading galaxy map...</div>
<div id="infoBox"></div>
<div id="searchBox">
  <input type="text" id="searchInput" placeholder="Search object...">
  <button class="searchBtn" id="searchPrev">&lt;</button>
  <span id="searchCount">0/0</span>
  <button class="searchBtn" id="searchNext">&gt;</button>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

let camera, scene, renderer, labelRenderer;
let objects = {};
let mapObjects = [];
let clock = new THREE.Clock();
let infoBox = document.getElementById('infoBox');
let followObject = null;
let isDragging = false;
let prevMousePos = { x: 0, y: 0 };
let userInteracted = false;
let cycleData = { cycle_zero_start_timestamp: 0, cycle_duration_ms: 60000 };
const availableEffects = {};
let searchResults = [], currentSearchIndex = 0;
let flatZRange = { min: -145, max: 145 };

function formatDuration(ms) {
  const secondsTotal = ms / 1000;
  if (secondsTotal <= 0) return '0.0 seconds';

  const days = Math.floor(ms / (24 * 60 * 60 * 1000));
  const hours = Math.floor((ms % (24 * 60 * 60 * 1000)) / (60 * 60 * 1000));
  const minutes = Math.floor((ms % (60 * 60 * 1000)) / (60 * 1000));
  const seconds = ((ms % (60 * 1000)) / 1000).toFixed(1);

  const parts = [];
  if (days) parts.push(days + (days === 1 ? ' day' : ' days'));
  if (hours) parts.push(hours + (hours === 1 ? ' hour' : ' hours'));
  if (minutes) parts.push(minutes + (minutes === 1 ? ' min' : ' mins'));
  // Always show seconds even if 0 (for sub-minute durations)
  if (seconds > 0 || parts.length === 0) parts.push(seconds + ' seconds');

  return parts.join(' ');
}

function vecToStr(vec) {
  return `x: ${vec.x.toFixed(1)}, y: ${vec.y.toFixed(1)}, z: ${vec.z.toFixed(1)}`;
}
function hashStringToNumber(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    hash = ((hash << 5) - hash) + str.charCodeAt(i);
    hash |= 0;
  }
  return Math.abs(hash);
}

function mulberry32(seed) {
  return function() {
    let t = (seed += 0x6D2B79F5);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}


function generateOrbitParams(seed) {
  const hash = hashStringToNumber(seed);
  const coreRadius = 100;
  const minOrbitRadius = coreRadius + 50;
  const maxOrbitRadius = 600;
  const radius = minOrbitRadius + (hash % (maxOrbitRadius - minOrbitRadius));
  const angleOffset = ((hash >> 8) % 360) * Math.PI / 180;
  const zOffset = flatZRange.min + (hash % (flatZRange.max - flatZRange.min));
  return { radius, angleOffset, zOffset };
}
function getGlobalTimeSeconds() {
  const now = Date.now();
  
const startTimestamp = cycleData.cycle_zero_start_timestamp;
const cycleDurationMs = cycleData.cycle_duration_ms;
const result = (now - startTimestamp) / cycleDurationMs;

const cycleNowData = {
  now,
  start_timestamp: startTimestamp,
  cycle_duration_ms: cycleDurationMs,
  result,
};
localStorage.setItem('cycle_now', JSON.stringify(cycleNowData));

  return (now - cycleData.cycle_zero_start_timestamp) / cycleData.cycle_duration_ms;
}
function parseEffectFunction(str) {
  try {
    const fn = new Function(`return (${str})`)();
    return typeof fn === 'function' ? fn : null;
  } catch {
    return null;
  }
}
function createAuraCircle(hexColor) {
  const color = /^#([0-9A-Fa-f]{6})$/.test(hexColor) ? hexColor : "#ff0000";
  const canvas = document.createElement("canvas");
  canvas.width = 128;
  canvas.height = 128;
  const ctx = canvas.getContext("2d");
  const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
  gradient.addColorStop(0, color + "AA");
  gradient.addColorStop(1, color + "00");
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, 128, 128);
  const texture = new THREE.CanvasTexture(canvas);
  const material = new THREE.SpriteMaterial({ map: texture, transparent: true, depthWrite: false });
  const sprite = new THREE.Sprite(material);
  sprite.scale.set(80, 80, 1);
  return sprite;
}
function simulateClickOnGroup(group) {
  const data = group.userData;
  const durationMs = (data.rotation_cycle_duration || 0) * cycleData.cycle_duration_ms;
  const durationFormatted = data.rotation_cycle_duration ? `${data.rotation_cycle_duration} (${formatDuration(durationMs)} / 360°)` : '—';

  infoBox.style.display = 'block';
  followObject = group;
  userInteracted = false;

  // Show static info initially (we'll update position live)
  infoBox.innerHTML = `<strong>${data.display_name || data.id}</strong><br>` +
                      `Rotation: ${durationFormatted}<br>` +
                      `Position: loading...`;

  console.log("Clicked:", data);
  console.log("Seed → Coords:", data.seed_id, vecToStr(group.position));
}
function setupClick() {
  window.addEventListener('click', (event) => {
    const mouse = new THREE.Vector2(
      (event.clientX / window.innerWidth) * 2 - 1,
      -(event.clientY / window.innerHeight) * 2 + 1
    );
    const raycaster = new THREE.Raycaster();
    raycaster.setFromCamera(mouse, camera);
    const allClickable = mapObjects.flatMap(g => g.children);
    const intersects = raycaster.intersectObjects(allClickable);
    if (intersects.length > 0) {
      simulateClickOnGroup(intersects[0].object.parent);
    }
  });
}
function setupControls() {
  const canvas = renderer.domElement;
  canvas.addEventListener('pointerdown', e => {
    isDragging = true;
    prevMousePos = { x: e.clientX, y: e.clientY };
  });
  canvas.addEventListener('pointerup', () => isDragging = false);
  canvas.addEventListener('pointerleave', () => isDragging = false);
  canvas.addEventListener('pointermove', e => {
    if (!isDragging) return;
    const dx = e.clientX - prevMousePos.x;
    const dy = e.clientY - prevMousePos.y;
    prevMousePos = { x: e.clientX, y: e.clientY };
    const panSpeed = 1;
    camera.position.x -= dx * panSpeed / camera.zoom;
    camera.position.y += dy * panSpeed / camera.zoom;
    userInteracted = true;
  });
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const factor = 1.05;
    camera.zoom *= (e.deltaY < 0 ? factor : 1 / factor);
    camera.zoom = THREE.MathUtils.clamp(camera.zoom, 0.1, 10);
    camera.updateProjectionMatrix();
    userInteracted = true;
  });
}
function createScene(objectsArray) {
  scene = new THREE.Scene();

  
// const renderer = new THREE.WebGLRenderer({ alpha: true });
// renderer.setClearColor(0x000000, 0);  // fully transparent background

  const aspect = window.innerWidth / window.innerHeight;
  const frustumSize = 1200;
  camera = new THREE.OrthographicCamera(-frustumSize * aspect / 2, frustumSize * aspect / 2, frustumSize / 2, -frustumSize / 2, -1000, 1000);
  camera.position.set(0, 0, 100);
  camera.lookAt(0, 0, 0);
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);

  renderer.setClearColor(0x000000, 0);

  document.body.appendChild(renderer.domElement);
  labelRenderer = new CSS2DRenderer();
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.domElement.style.position = 'absolute';
  labelRenderer.domElement.style.top = '0';
  labelRenderer.domElement.style.pointerEvents = 'none';
  document.body.appendChild(labelRenderer.domElement);
  const loader = new THREE.TextureLoader();

  objectsArray.forEach(obj => {
    const group = new THREE.Group();
    group.userData = obj;
    if (obj.aura_color) group.add(createAuraCircle(obj.aura_color));
    loader.load(obj.icon_url, tex => {
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
      sprite.scale.set(40, 40, 1);
      sprite.userData.parentGroup = group;
      sprite.name = 'icon';
      sprite.cursor = 'pointer';
      group.add(sprite);
    });
    const labelDiv = document.createElement('div');
    labelDiv.className = 'label clickable';
    labelDiv.textContent = obj.display_name || obj.id;
    labelDiv.addEventListener('click', () => simulateClickOnGroup(group));
    const label = new CSS2DObject(labelDiv);
    label.position.set(0, -30, 0);
    group.add(label);
    scene.add(group);
    objects[obj.id] = group;
    mapObjects.push(group);
  });
}
function animate() {
  requestAnimationFrame(animate);
  const globalTime = getGlobalTimeSeconds();
Object.values(objects).forEach(group => {
    const obj = group.userData;
    if (!obj._orbitParams && !obj.isCore) {
      obj._orbitParams = generateOrbitParams(obj.seed_id || obj.id);
    }
    if (!obj.isCore) {
      const { radius, angleOffset, zOffset } = obj._orbitParams;
      const angle = (globalTime / (obj.rotation_cycle_duration || 60)) * 2 * Math.PI + angleOffset;
      group.position.set(radius * Math.cos(angle), radius * Math.sin(angle), zOffset);
    }
if (followObject) {
  const data = followObject.userData;
  const durationMs = (data.rotation_cycle_duration || 0) * cycleData.cycle_duration_ms;
  const durationFormatted = data.rotation_cycle_duration ? `${data.rotation_cycle_duration} (${formatDuration(durationMs)} / 360°)` : '—';

  // Update infoBox live position
  infoBox.innerHTML = `<strong>${data.display_name || data.id}</strong><br>` +
                      `Rotation: ${durationFormatted}<br>` +
                      `Position: ${vecToStr(followObject.position)}`;
}
  });
  if (followObject && !userInteracted) {
    const target = followObject.position;
    camera.position.x += (target.x - camera.position.x) * 0.1;
    camera.position.y += (target.y - camera.position.y) * 0.1;
    camera.updateProjectionMatrix();
  } else if (followObject && userInteracted) {
    infoBox.style.display = 'none';
    followObject = null;
  }
  // console.log(`Camera: x=${camera.position.x.toFixed(1)}, y=${camera.position.y.toFixed(1)}, z=${camera.position.z.toFixed(1)}`);
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function setupSearch() {
  const input = document.getElementById('searchInput');
  const count = document.getElementById('searchCount');
  const next = document.getElementById('searchNext');
  const prev = document.getElementById('searchPrev');
  function updateResults() {
    const q = input.value.toLowerCase();
    searchResults = mapObjects.filter(g => (g.userData.display_name || '').toLowerCase().includes(q));
    currentSearchIndex = 0;
    count.textContent = `${searchResults.length ? 1 : 0}/${searchResults.length}`;
  }
  function goto(index) {
    if (!searchResults.length) return;
    currentSearchIndex = (index + searchResults.length) % searchResults.length;
    count.textContent = `${currentSearchIndex + 1}/${searchResults.length}`;
    simulateClickOnGroup(searchResults[currentSearchIndex]);
  }
  input.addEventListener('input', updateResults);
  next.addEventListener('click', () => goto(currentSearchIndex + 1));
  prev.addEventListener('click', () => goto(currentSearchIndex - 1));
}
window.addEventListener('resize', () => {
  const aspect = window.innerWidth / window.innerHeight;
  const frustumSize = 1200;
  camera.left = -frustumSize * aspect / 2;
  camera.right = frustumSize * aspect / 2;
  camera.top = frustumSize / 2;
  camera.bottom = -frustumSize / 2;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
});

(() => {
const width = window.innerWidth;
const height = window.innerHeight;
  const starsCount = 200;
  let starseed = 2137;
  let regenerateOnMove = false;
  let regenerateOnResize = false;

  // Seeded RNG instance
  let rand = mulberry32(starseed);

  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = width;
  canvas.height = height;

  function drawStars() {
    ctx.clearRect(0, 0, width, height);

    // Radial gradient background
    const gradient = ctx.createRadialGradient(
      width / 2,
      height / 2,
      0,
      width / 2,
      height / 2,
      width / 1.5
    );
    gradient.addColorStop(0, '#00111f');
    gradient.addColorStop(1, '#000000');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, width, height);

    for (let i = 0; i < starsCount; i++) {
      const x = rand() * width;
      const y = rand() * height;
      const radius = rand() * 1.2 + 0.2;

      const glowRadius = radius * 4;
      const starGradient = ctx.createRadialGradient(x, y, 0, x, y, glowRadius);
      starGradient.addColorStop(0, 'rgba(255,255,255,1)');
      starGradient.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = starGradient;

      ctx.beginPath();
      ctx.arc(x, y, glowRadius, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = 'white';
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function applyBackground() {
    drawStars();
    const dataURL = canvas.toDataURL();
    document.body.style.backgroundImage = `url(${dataURL})`;
document.body.style.backgroundRepeat = 'no-repeat';
document.body.style.backgroundSize = 'cover'; // fill whole screen, maintain aspect ratio
document.body.style.backgroundPosition = 'center center';
document.body.style.backgroundAttachment = 'fixed';
document.body.style.backgroundColor = '#000'; // fallback
  }

  // Throttle helper
  function throttle(fn, limit) {
    let inThrottle;
    return function() {
      if (!inThrottle) {
        fn.apply(this, arguments);
        inThrottle = true;
        setTimeout(() => (inThrottle = false), limit);
      }
    };
  }

  applyBackground();

  if (regenerateOnMove) {
    window.addEventListener(
      'mousemove',
      throttle(() => {
        // Optionally update seed or just redraw with same seed for now
        rand = mulberry32(starseed);
        applyBackground();
      }, 200)
    );
  }

  if (regenerateOnResize) {
    window.addEventListener(
      'resize',
      throttle(() => {
        rand = mulberry32(starseed);
        applyBackground();
      }, 500)
    );
  }
})();

(async () => {
  try {
    const [cycle, config] = await Promise.all([
      fetch(`https://theredmineword.github.io/map/map/cycle.json?time=${encodeURIComponent(new Date().toISOString())}&jam=${Math.random().toString(36).slice(2, 10)}`).then(r => r.json()),
      fetch(`https://theredmineword.github.io/map/map/config.json?time=${encodeURIComponent(new Date().toISOString())}&jam=${Math.random().toString(36).slice(2, 10)}`).then(r => r.json())
    ]);
    cycleData = cycle.movement;
    config.effects.forEach(eff => {
      const fn = parseEffectFunction(eff.function);
      if (fn) availableEffects[eff.id] = fn;
    });
    const corePos = new THREE.Vector3(...config.core_object.point_zero);
    const validParents = new Set([config.core_object.data.id, ...config.core_object.close_orbit.map(o => o.id)]);

const baseUrl = config.galaxy.elements;
const urlWithParams = `${baseUrl}?time=${encodeURIComponent(new Date().toISOString())}&jam=${Math.random().toString(36).slice(2, 10)}`;

    const elementsUrls = await fetch(urlWithParams).then(r => r.json());
    const elementsArrays = await Promise.all(elementsUrls.map(url => fetch(url).then(r => r.json())));
    const elementsData = elementsArrays.flat().filter(e => e.parent_id && validParents.has(e.parent_id));
    const allObjects = [
      {
        ...config.core_object.data,
        seed_id: config.core_object.data.seed_id || 'core_0001',
        display_name: config.core_object.data.display_name || 'Galactic Core',
        position: corePos,
        rotation_cycle_duration: 0,
        isCore: true
      },
      ...config.core_object.close_orbit.map(o => ({ ...o, isCore: false })),
      ...elementsData.map(o => ({ ...o, isCore: false }))
    ];
    createScene(allObjects);
    setupControls();
    setupClick();
    setupSearch();
    document.getElementById('loadingOverlay')?.classList.add('hidden');

let mycustomeval = 0;

function myCustomFunction() {
  if (mycustomeval === 0) {
    // Your one-time code here
(async () => {
    const url = `https://theredmineword.github.io/map/api/html/missionBriefing.js?jam=${Math.random()}`;

    } catch (err) {
      console.error("Failed to load or execute mission briefing script:", err);
    }
})();



    console.log('Custom function executed!');

    // After running once, set mycustomeval so it won’t run again
    mycustomeval = 1;
  }
}
    
    setTimeout(() => {
  document.getElementById('loadingOverlay')?.remove();
  myCustomFunction();
}, 500);

    
    animate();
  } catch (e) {
    document.getElementById('loadingOverlay').innerHTML = "Failed to load map data.<br>" + e.message;
    console.error(e);
  }
})();
</script>
</body>
</html>

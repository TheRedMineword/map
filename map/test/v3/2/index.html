function formatDuration(ms) {
  const secondsTotal = ms / 1000;
  if (secondsTotal <= 0) return '0.0 seconds';

  const days = Math.floor(ms / (24 * 60 * 60 * 1000));
  const hours = Math.floor((ms % (24 * 60 * 60 * 1000)) / (60 * 60 * 1000));
  const minutes = Math.floor((ms % (60 * 60 * 1000)) / (60 * 1000));
  const seconds = ((ms % (60 * 1000)) / 1000).toFixed(1);

  const parts = [];
  if (days) parts.push(days + (days === 1 ? ' day' : ' days'));
  if (hours) parts.push(hours + (hours === 1 ? ' hour' : ' hours'));
  if (minutes) parts.push(minutes + (minutes === 1 ? ' min' : ' mins'));
  // Always show seconds even if 0 (for sub-minute durations)
  if (seconds > 0 || parts.length === 0) parts.push(seconds + ' seconds');

  return parts.join(' ');
}

function vecToStr(vec) {
  return `x: ${vec.x.toFixed(1)}, y: ${vec.y.toFixed(1)}, z: ${vec.z.toFixed(1)}`;
}
function hashStringToNumber(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    hash = ((hash << 5) - hash) + str.charCodeAt(i);
    hash |= 0;
  }
  return Math.abs(hash);
}

function mulberry32(seed) {
  return function() {
    let t = (seed += 0x6D2B79F5);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}


function generateOrbitParams(seed, obj) {
  const hash = hashStringToNumber(seed);
  const coreRadius = 100;
  const minOrbitRadius = obj.min_y !== undefined ? obj.min_y : coreRadius + 50;
  const maxOrbitRadius = obj.max_y !== undefined ? obj.max_y : 600;
  const radius = minOrbitRadius + (hash % (maxOrbitRadius - minOrbitRadius));
  const angleOffset = ((hash >> 8) % 360) * Math.PI / 180;
  const zOffset = flatZRange.min + (hash % (flatZRange.max - flatZRange.min));

  const result = { radius, angleOffset, zOffset };
const jsonObject = {
    variables: {
      hash,
      coreRadius,
      minOrbitRadius,
      maxOrbitRadius,
      flatZRange,
    },
    result
  };

console.log("cords");

  return { radius, angleOffset, zOffset };
}

const startTimestamp = cycleData.cycle_zero_start_timestamp;
const cycleDurationMs = cycleData.cycle_duration_ms;
const result = (now - startTimestamp) / cycleDurationMs;

function createAuraCircle(hexColor) {
  const color = /^#([0-9A-Fa-f]{6})$/.test(hexColor) ? hexColor : "#ff0000";

  canvas.width = 128;
  canvas.height = 128;
  const ctx = canvas.getContext("2d");
  const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
  gradient.addColorStop(0, color + "AA");
  gradient.addColorStop(1, color + "00");
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, 128, 128);
  const texture = new THREE.CanvasTexture(canvas);
  const material = new THREE.SpriteMaterial({ map: texture, transparent: true, depthWrite: false });
  const sprite = new THREE.Sprite(material);
  sprite.scale.set(80, 80, 1);
  return sprite;
}

function setupClick() {
  window.addEventListener('click', (event) => {
    const mouse = new THREE.Vector2(
      (event.clientX / window.innerWidth) * 2 - 1,
      -(event.clientY / window.innerHeight) * 2 + 1
    );
    const raycaster = new THREE.Raycaster();
    raycaster.setFromCamera(mouse, camera);
    const allClickable = mapObjects.flatMap(g => g.children);
    const intersects = raycaster.intersectObjects(allClickable);
    if (intersects.length > 0) {
      simulateClickOnGroup(intersects[0].object.parent);
    }
  });
}
function setupControls() {
  const canvas = renderer.domElement;
  canvas.addEventListener('pointerdown', e => {
    isDragging = true;
    prevMousePos = { x: e.clientX, y: e.clientY };
  });
  canvas.addEventListener('pointerup', () => isDragging = false);
  canvas.addEventListener('pointerleave', () => isDragging = false);
  canvas.addEventListener('pointermove', e => {
    if (!isDragging) return;
    const dx = e.clientX - prevMousePos.x;
    const dy = e.clientY - prevMousePos.y;
    prevMousePos = { x: e.clientX, y: e.clientY };
    const panSpeed = 1;
    camera.position.x -= dx * panSpeed / camera.zoom;
    camera.position.y += dy * panSpeed / camera.zoom;
    userInteracted = true;
  });
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const factor = 1.05;
    camera.zoom *= (e.deltaY < 0 ? factor : 1 / factor);
    camera.zoom = THREE.MathUtils.clamp(camera.zoom, 0.1, 10);
    camera.updateProjectionMatrix();
    userInteracted = true;
  });
}

function setupSearch() {
  const input = document.getElementById('searchInput');
  const count = document.getElementById('searchCount');
  const next = document.getElementById('searchNext');
  const prev = document.getElementById('searchPrev');
  function updateResults() {
    const q = input.value.toLowerCase();
    searchResults = mapObjects.filter(g => (g.userData.display_name || '').toLowerCase().includes(q));
    currentSearchIndex = 0;
    count.textContent = `${searchResults.length ? 1 : 0}/${searchResults.length}`;
  }
  function goto(index) {
    if (!searchResults.length) return;
    currentSearchIndex = (index + searchResults.length) % searchResults.length;
    count.textContent = `${currentSearchIndex + 1}/${searchResults.length}`;
    simulateClickOnGroup(searchResults[currentSearchIndex]);
  }
  input.addEventListener('input', updateResults);
  next.addEventListener('click', () => goto(currentSearchIndex + 1));
  prev.addEventListener('click', () => goto(currentSearchIndex - 1));
}

(() => {
const width = window.innerWidth;
const height = window.innerHeight;
  const starsCount = 200;
  let starseed = 2137;
  let regenerateOnMove = false;
  let regenerateOnResize = false;

  // Seeded RNG instance
  let rand = mulberry32(starseed);

  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = width;
  canvas.height = height;

  function drawStars() {
    ctx.clearRect(0, 0, width, height);

    // Radial gradient background
    const gradient = ctx.createRadialGradient(
      width / 2,
      height / 2,
      0,
      width / 2,
      height / 2,
      width / 1.5
    );
    gradient.addColorStop(0, '#00111f');
    gradient.addColorStop(1, '#000000');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, width, height);

    for (let i = 0; i < starsCount; i++) {
      const x = rand() * width;
      const y = rand() * height;
      const radius = rand() * 1.2 + 0.2;

      const glowRadius = radius * 4;
      const starGradient = ctx.createRadialGradient(x, y, 0, x, y, glowRadius);
      starGradient.addColorStop(0, 'rgba(255,255,255,1)');
      starGradient.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = starGradient;

      ctx.beginPath();
      ctx.arc(x, y, glowRadius, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = 'white';
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function applyBackground() {
    drawStars();
    const dataURL = canvas.toDataURL();
    document.body.style.backgroundImage = `url(${dataURL})`;
document.body.style.backgroundRepeat = 'no-repeat';
document.body.style.backgroundSize = 'cover'; // fill whole screen, maintain aspect ratio
document.body.style.backgroundPosition = 'center center';
document.body.style.backgroundAttachment = 'fixed';
document.body.style.backgroundColor = '#000'; // fallback
  }

  // Throttle helper
  function throttle(fn, limit) {
    let inThrottle;
    return function() {
      if (!inThrottle) {
        fn.apply(this, arguments);
        inThrottle = true;
        setTimeout(() => (inThrottle = false), limit);
      }
    };
  }

  applyBackground();

  if (regenerateOnMove) {
    window.addEventListener(
      'mousemove',
      throttle(() => {
        // Optionally update seed or just redraw with same seed for now
        rand = mulberry32(starseed);
        applyBackground();
      }, 200)
    );
  }

  if (regenerateOnResize) {
    window.addEventListener(
      'resize',
      throttle(() => {
        rand = mulberry32(starseed);
        applyBackground();
      }, 500)
    );
  }
})();

    async function playRawMp3WithRetry(url) {
  const audio = new Audio(url);
  audio.loop = true;
  audio.volume = 0.6;
  audio.muted = true; // muted initially to try autoplay

  async function tryPlay() {
    try {
      await audio.play();
      // Success!
      console.log("✅ Music started playing:", url);

      // Unmute after brief delay
      setTimeout(() => {
        audio.muted = false;
      }, 500);

      // Remove retry listener if it exists
      document.removeEventListener("pointerdown", handleInteraction, true);
    } catch (err) {
      console.warn("Autoplay blocked, waiting for user interaction...");
      // Wait for user input to try again
      document.addEventListener("pointerdown", handleInteraction, true);
    }
  }

  function handleInteraction() {
    // Try again after user interacts
    tryPlay();
  }

  // First attempt
  tryPlay();
}

  // Function to dynamically load JSZip
  function loadJSZip() {
    return new Promise((resolve, reject) => {
      const existingScript = document.querySelector('script[src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"]');
      if (existingScript) {
        console.log('JSZip is already loaded.');
        return resolve();
      }

      const script = document.createElement('script');
      script.src = "https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js";
      script.onload = resolve;
      script.onerror = reject;
      document.head.appendChild(script);
    });
  }

  // Function to check if the base64 string is a ZIP file
  function isZipFile(base64Data) {
    const binaryString = atob(base64Data.slice(0, 100)); // Decode a portion of the base64 string
    const zipSignature = [80, 75, 3, 4]; // PK\x03\x04
    return zipSignature.every((byte, index) => binaryString.charCodeAt(index) === byte);
  }

  // Function to process ZIP file
  async function processZip(base64Data) {
    console.log('Processing as ZIP file...');

    // Convert base64 to binary
    const binaryString = atob(base64Data);
    const byteArray = new Uint8Array(binaryString.length);
    for (let i = 0; i < binaryString.length; i++) {
      byteArray[i] = binaryString.charCodeAt(i);
    }

    // Use JSZip to unzip
    const zip = await JSZip.loadAsync(byteArray);

    // Extract font and .txt file
    let fontBlob, txtContent;
    await Promise.all(
      Object.keys(zip.files).map(async (fileName) => {
        if (fileName.endsWith('.ttf') || fileName.endsWith('.woff') || fileName.endsWith('.woff2')) {
          console.log(`Found font file: ${fileName}`);
          fontBlob = await zip.files[fileName].async('blob');
        } else if (fileName.endsWith('.txt')) {
          console.log(`Found text file: ${fileName}`);
          txtContent = await zip.files[fileName].async('string');
        }
      })
    );

    // Print .txt file content
    if (txtContent) {
      console.log('TXT Content:', txtContent);
    } else {
      console.warn('No .txt file found in the ZIP.');
    }

    // Load the font
    if (fontBlob) {
      const fontUrl = URL.createObjectURL(fontBlob);
      const fontFace = new FontFace('DynamicFont', `url(${fontUrl})`);
      document.fonts.add(fontFace);

      // Apply the font to the body
      fontFace.load().then(() => {
        document.body.style.fontFamily = 'DynamicFont, sans-serif';
        console.log('Font loaded and applied successfully.');
      });
    } else {
      console.warn('No font file found in the ZIP.');
    }
  }

  // Function to process a standalone font file
  function processFont(base64Data) {
    console.log('Processing as standalone font file...');

    const binaryString = atob(base64Data);
    const byteArray = new Uint8Array(binaryString.length);
    for (let i = 0; i < binaryString.length; i++) {
      byteArray[i] = binaryString.charCodeAt(i);
    }

    const fontBlob = new Blob([byteArray]);
    const fontUrl = URL.createObjectURL(fontBlob);
    const fontFace = new FontFace('DynamicFont', `url(${fontUrl})`);
    document.fonts.add(fontFace);

    // Apply the font to the body
    fontFace.load().then(() => {
      document.body.style.fontFamily = 'DynamicFont, sans-serif';
      console.log('Font loaded and applied successfully.');
    });
  }

  // Main function to determine and process the input
  async function processBase64(base64Data) {
    try {
      if (isZipFile(base64Data)) {
        console.log('Detected ZIP file format.');
        await processZip(base64Data);
      } else {
        console.log('Detected standalone font file format.');
        processFont(base64Data);
      }
    } catch (error) {
      console.error('Error during processing:', error);
    }
  }

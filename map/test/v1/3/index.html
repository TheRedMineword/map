<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Galaxy Map 2D Orbit + Spin</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body, html { margin:0; padding:0; overflow:hidden; background:#000; font-family:sans-serif; }
  #infoBox {
    position: fixed; bottom: 20px; left: 20px;
    background: rgba(0,0,0,0.75); color: #fff;
    padding: 10px 15px; border-radius: 5px;
    font-size: 14px; max-width: 300px;
    display: none; pointer-events: none; user-select: none;
  }
  .label {
    color: white;
    background: rgba(0,0,0,0.6);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 13px;
    pointer-events: none;
    user-select: none;
    white-space: nowrap;
    transform-origin: center center;
  }
  .label.clickable {
    cursor: pointer;
    pointer-events: auto;
  }
  #loadingOverlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.95);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2em;
    z-index: 9999;
    transition: opacity 0.4s;
  }
  #loadingOverlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="loadingOverlay">Loading galaxy map...</div>
<div id="infoBox"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

let camera, scene, renderer, labelRenderer;
let objects = {};
let clock = new THREE.Clock();
let infoBox = document.getElementById('infoBox');
let followObject = null;
let followStartTime = 0;
const FOLLOW_DURATION = 4000;
let cycleData = { cycle_zero_start_timestamp: 0, cycle_duration_ms: 60000 };

const activeEffects = {};
const availableEffects = {};

function formatDuration(ms) {
  const hours = ms / (1000 * 60 * 60);
  if (hours < 24) return `${Math.round(hours)}h`;
  const days = hours / 24;
  return `${Math.round(days)}d`;
}

function hashStringToNumber(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    hash = ((hash << 5) - hash) + str.charCodeAt(i);
    hash |= 0;
  }
  return Math.abs(hash);
}

function generateOrbitParams(seed) {
  const hash = hashStringToNumber(seed);
  const coreRadius = 100;
  const minOrbitRadius = coreRadius + 50;
  const maxOrbitRadius = 600;
  const radius = minOrbitRadius + (hash % (maxOrbitRadius - minOrbitRadius));
  const angleOffset = ((hash >> 8) % 360) * Math.PI / 180;
  return { radius, angleOffset };
}

function vecToStr(vec) {
  return `x: ${vec.x.toFixed(1)}, y: ${vec.y.toFixed(1)}, z: ${vec.z.toFixed(1)}`;
}

async function fetchJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error('Failed to fetch ' + url);
  return await res.json();
}

function parseEffectFunction(str) {
  try {
    const fn = new Function(`return (${str})`)();
    return typeof fn === 'function' ? fn : null;
  } catch {
    return null;
  }
}

async function loadData() {
  const [cycle, config] = await Promise.all([
    fetchJSON('https://theredmineword.github.io/map/map/cycle.json?' + Math.random()),
    fetchJSON('https://theredmineword.github.io/map/map/config.json?' + Math.random())
  ]);
  cycleData = cycle.movement;

  // Load effect functions
  config.effects.forEach(eff => {
    const fn = parseEffectFunction(eff.function);
    if (fn) availableEffects[eff.id] = fn;
  });

  const corePos = new THREE.Vector3(...config.core_object.point_zero);
  const galaxyConfig = config;

  const elementsUrls = await fetchJSON(galaxyConfig.galaxy.elements + '?' + Math.random());
  const elementsArrays = await Promise.all(elementsUrls.map(url => fetchJSON(url + '?' + Math.random())));
  let elementsData = elementsArrays.flat();

  const validParents = new Set([galaxyConfig.core_object.data.id]);
  galaxyConfig.core_object.close_orbit.forEach(o => validParents.add(o.id));
  elementsData = elementsData.filter(e => e.parent_id && validParents.has(e.parent_id));

  const allObjects = [];
  allObjects.push({
    ...galaxyConfig.core_object.data,
    seed_id: galaxyConfig.core_object.data.seed_id || 'core_0001',
    display_name: galaxyConfig.core_object.data.display_name || 'Galactic Core',
    position: corePos,
    rotation_cycle_duration: 0,
    icon_url: galaxyConfig.core_object.data.icon_url,
    isCore: true,
  });
  galaxyConfig.core_object.close_orbit.forEach(obj => allObjects.push({...obj, isCore: false}));
  elementsData.forEach(obj => allObjects.push({...obj, isCore: false}));

  return allObjects;
}

function getGlobalTimeSeconds() {
  const now = Date.now();
  return (now - cycleData.cycle_zero_start_timestamp) / cycleData.cycle_duration_ms;
}

function hexToColor(hex) {
  return new THREE.Color(hex);
}

function createAuraCircle(color) {
  const geometry = new THREE.CircleGeometry(25, 32);
  const material = new THREE.MeshBasicMaterial({ color, opacity: 0.25, transparent: true });
  const circle = new THREE.Mesh(geometry, material);
  circle.rotation.x = -Math.PI / 2;
  return circle;
}
function setupControls() {
  const canvas = renderer.domElement;

  canvas.addEventListener('pointerdown', e => {
    isDragging = true;
    prevMousePos = { x: e.clientX, y: e.clientY };
  });
  canvas.addEventListener('pointerup', () => isDragging = false);
  canvas.addEventListener('pointerleave', () => isDragging = false);
  canvas.addEventListener('pointermove', e => {
    if (!isDragging) return;
    const dx = e.clientX - prevMousePos.x;
    const dy = e.clientY - prevMousePos.y;
    prevMousePos = { x: e.clientX, y: e.clientY };
    const panSpeed = 1;
    camera.position.x -= dx * panSpeed / camera.zoom;
    camera.position.y += dy * panSpeed / camera.zoom;
    camera.updateProjectionMatrix();
  });
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const factor = 1.05;
    if (e.deltaY < 0) camera.zoom *= factor;
    else camera.zoom /= factor;
    camera.zoom = THREE.MathUtils.clamp(camera.zoom, 0.1, 10);
    camera.updateProjectionMatrix();
  });

  let lastTouch = null;
  canvas.addEventListener('touchstart', e => {
    if (e.touches.length === 1) {
      isDragging = true;
      lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }
  });
  canvas.addEventListener('touchmove', e => {
    if (!isDragging || e.touches.length !== 1) return;
    const touch = e.touches[0];
    const dx = touch.clientX - lastTouch.x;
    const dy = touch.clientY - lastTouch.y;
    lastTouch = { x: touch.clientX, y: touch.clientY };
    camera.position.x -= dx / camera.zoom;
    camera.position.y += dy / camera.zoom;
    camera.updateProjectionMatrix();
  });
  canvas.addEventListener('touchend', () => {
    isDragging = false;
    lastTouch = null;
  });
}

function createScene(objectsArray) {
  scene = new THREE.Scene();
  const frustumSize = 1200;
  const aspect = window.innerWidth / window.innerHeight;
  camera = new THREE.OrthographicCamera(
    -frustumSize * aspect / 2,
    frustumSize * aspect / 2,
    frustumSize / 2,
    -frustumSize / 2,
    -1000,
    1000
  );
  camera.position.set(0, 0, 100);
  camera.lookAt(0, 0, 0);
  camera.zoom = 1;
  camera.updateProjectionMatrix();

  renderer = new THREE.WebGLRenderer({antialias: true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000);
  document.body.appendChild(renderer.domElement);

  labelRenderer = new CSS2DRenderer();
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.domElement.style.position = 'absolute';
  labelRenderer.domElement.style.top = '0';
  labelRenderer.domElement.style.pointerEvents = 'none';
  document.body.appendChild(labelRenderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 0.7));

  const loader = new THREE.TextureLoader();

  objectsArray.forEach(obj => {
    const group = new THREE.Group();
    group.userData = obj;

    // Aura ring
    if (obj.aura_color) {
      const aura = createAuraCircle(hexToColor(obj.aura_color));
      aura.name = 'aura';
      group.add(aura);
    }

    loader.load(obj.icon_url, tex => {
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
      sprite.scale.set(40, 40, 1);
      group.add(sprite);
      group.userData.sprite = sprite;
    });

    const labelDiv = document.createElement('div');
    labelDiv.className = 'label clickable';
    labelDiv.textContent = obj.display_name || obj.id;
    labelDiv.addEventListener('click', () => simulateClickOnGroup(group));
    const label = new CSS2DObject(labelDiv);
    label.position.set(0, -30, 0);
    group.add(label);
    group.userData.label = label;

    if (obj.effects) {
      activeEffects[obj.id] = obj.effects.map(e => availableEffects[e]).filter(Boolean);
    }

    scene.add(group);
    objects[obj.id] = group;
  });
}

function simulateClickOnGroup(group) {
  const data = group.userData;
  const durationMs = (data.rotation_cycle_duration || 0) * cycleData.cycle_duration_ms;
  const durationFormatted = data.rotation_cycle_duration ? `${data.rotation_cycle_duration} (${formatDuration(durationMs)} / 360°)` : '—';
  infoBox.style.display = 'block';
  infoBox.innerHTML = `<strong>${data.display_name || data.id}</strong><br>` +
                      `Position: ${vecToStr(group.position)}<br>` +
                      `Rotation: ${durationFormatted}`;
  followObject = group;
  followStartTime = performance.now();
}

// Rest of the script continues unchanged: setupControls, animate, etc.
  function animate() {
  requestAnimationFrame(animate);
  const globalTime = getGlobalTimeSeconds();

  Object.values(objects).forEach(group => {
    const obj = group.userData;
    if (obj.isCore) {
      group.position.set(...obj.position.toArray());
      if (group.userData.sprite) group.userData.sprite.material.rotation = 0;
      return;
    }

    if (!obj._orbitParams) {
      obj._orbitParams = generateOrbitParams(obj.seed_id || obj.id);
      console.log(`${obj.id} → orbit radius=${obj._orbitParams.radius}, angleOffset=${obj._orbitParams.angleOffset}`);
    }

    const { radius, angleOffset } = obj._orbitParams;
    const cycleDur = obj.rotation_cycle_duration || 60;
    const angle = (globalTime / cycleDur) * 2 * Math.PI + angleOffset;
    const pos = new THREE.Vector3(radius * Math.cos(angle), radius * Math.sin(angle), 0);
    group.position.copy(pos);

    if (group.userData.sprite) {
      const spinDuration = 60 / (obj.rotation_cycle_duration || 1);
      const spinAngle = (globalTime / spinDuration) * 2 * Math.PI;
      group.userData.sprite.material.rotation = spinAngle;
    }

    if (group.userData.label) {
      group.userData.label.element.style.transform = 'translate(-50%, -50%) rotate(0deg)';
    }
  });

  if (followObject) {
    const t = performance.now() - followStartTime;
    if (t < FOLLOW_DURATION) {
      const target = followObject.position;
      camera.position.x += (target.x - camera.position.x) * 0.1;
      camera.position.y += (target.y - camera.position.y) * 0.1;
      camera.updateProjectionMatrix();
    } else {
      followObject = null;
    }
  }

  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  const aspect = window.innerWidth / window.innerHeight;
  const frustumSize = 1200;
  camera.left = -frustumSize * aspect / 2;
  camera.right = frustumSize * aspect / 2;
  camera.top = frustumSize / 2;
  camera.bottom = -frustumSize / 2;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
});

(async () => {
  try {
    const objs = await loadData();
    createScene(objs);
    setupControls();
    setupClick();
    document.getElementById('loadingOverlay')?.classList.add('hidden');
    setTimeout(() => document.getElementById('loadingOverlay')?.remove(), 500);
    animate();
  } catch (e) {
    const loading = document.getElementById('loadingOverlay');
    if (loading) {
      loading.innerHTML = "Failed to load map data.<br>" + e.message;
      loading.style.color = 'red';
    }
    console.error(e);
  }
})();

</script>

</body>
</html>

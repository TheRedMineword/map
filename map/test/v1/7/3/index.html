<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Galaxy Map 2D Orbit + Spin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: sans-serif;
    }
    #infoBox {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 10px 15px;
      border-radius: 5px;
      font-size: 14px;
      max-width: 300px;
      display: none;
      pointer-events: none;
      user-select: none;
    }
    .label {
      color: white;
      background: rgba(0, 0, 0, 0.6);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
      pointer-events: none;
      user-select: none;
      white-space: nowrap;
      transform-origin: center center;
    }
    .clickable {
      cursor: pointer;
      pointer-events: auto;
    }
    #loadingOverlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.95);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2em;
      z-index: 9999;
      transition: opacity 0.4s;
    }
    #loadingOverlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #searchBox {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      padding: 10px;
      border-radius: 6px;
      color: #fff;
      z-index: 10;
      font-size: 14px;
      display: flex;
      gap: 6px;
      align-items: center;
    }
    #searchInput {
      padding: 4px;
      width: 200px;
      border: none;
      border-radius: 4px;
    }
    .searchBtn {
      background: #222;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 4px 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
<div id="loadingOverlay">Loading galaxy map...</div>
<div id="infoBox"></div>
<div id="searchBox">
  <input type="text" id="searchInput" placeholder="Search object...">
  <button class="searchBtn" id="searchPrev">&lt;</button>
  <span id="searchCount">0/0</span>
  <button class="searchBtn" id="searchNext">&gt;</button>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

let camera, scene, renderer, labelRenderer;
let objects = {};
let mapObjects = [];
let clock = new THREE.Clock();
let infoBox = document.getElementById('infoBox');
let followObject = null;
let isDragging = false;
let prevMousePos = { x: 0, y: 0 };
let userInteracted = false;
let cycleData = { cycle_zero_start_timestamp: 0, cycle_duration_ms: 60000 };
const availableEffects = {};
let searchResults = [], currentSearchIndex = 0;

function formatDuration(ms) {
  const minutes = Math.floor(ms / 60000);
  const seconds = ((ms % 60000) / 1000).toFixed(1);
  return `${minutes}m ${seconds}s`;
}
function vecToStr(vec) {
  return `x: ${vec.x.toFixed(1)}, y: ${vec.y.toFixed(1)}, z: ${vec.z.toFixed(1)}`;
}
function hashStringToNumber(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    hash = ((hash << 5) - hash) + str.charCodeAt(i);
    hash |= 0;
  }
  return Math.abs(hash);
}
function generateOrbitParams(seed) {
  const hash = hashStringToNumber(seed);
  const coreRadius = 100;
  const minOrbitRadius = coreRadius + 50;
  const maxOrbitRadius = 600;
  const radius = minOrbitRadius + (hash % (maxOrbitRadius - minOrbitRadius));
  const angleOffset = ((hash >> 8) % 360) * Math.PI / 180;
  return { radius, angleOffset };
}
function getGlobalTimeSeconds() {
  const now = Date.now();
  return (now - cycleData.cycle_zero_start_timestamp) / cycleData.cycle_duration_ms;
}
function parseEffectFunction(str) {
  try {
    const fn = new Function(`return (${str})`)();
    return typeof fn === 'function' ? fn : null;
  } catch {
    return null;
  }
}
function createAuraCircle(hexColor) {
  const color = /^#([0-9A-Fa-f]{6})$/.test(hexColor) ? hexColor : "#ff0000";
  const canvas = document.createElement("canvas");
  canvas.width = 128;
  canvas.height = 128;
  const ctx = canvas.getContext("2d");
  const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
  gradient.addColorStop(0, color + "AA");
  gradient.addColorStop(1, color + "00");
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, 128, 128);
  const texture = new THREE.CanvasTexture(canvas);
  const material = new THREE.SpriteMaterial({ map: texture, transparent: true, depthWrite: false });
  const sprite = new THREE.Sprite(material);
  sprite.scale.set(80, 80, 1);
  return sprite;
}
function simulateClickOnGroup(group) {
  const data = group.userData;
  const durationMs = (data.rotation_cycle_duration || 0) * cycleData.cycle_duration_ms;
  const durationFormatted = data.rotation_cycle_duration ? `${data.rotation_cycle_duration} (${formatDuration(durationMs)} / 360°)` : '—';
  infoBox.style.display = 'block';
  infoBox.innerHTML = `<strong>${data.display_name || data.id}</strong><br>` +
                      `Position: ${vecToStr(group.position)}<br>` +
                      `Rotation: ${durationFormatted}`;
  followObject = group;
  userInteracted = false;
  console.log("Clicked:", data);
  console.log("Seed → Coords:", data.seed_id, vecToStr(group.position));
}
function setupClick() {
  window.addEventListener('click', (event) => {
    const mouse = new THREE.Vector2(
      (event.clientX / window.innerWidth) * 2 - 1,
      -(event.clientY / window.innerHeight) * 2 + 1
    );
    const raycaster = new THREE.Raycaster();
    raycaster.setFromCamera(mouse, camera);
    const allClickable = mapObjects.flatMap(g => g.children);
    const intersects = raycaster.intersectObjects(allClickable);
    if (intersects.length > 0) {
      simulateClickOnGroup(intersects[0].object.parent);
    }
  });
}
function setupControls() {
  const canvas = renderer.domElement;
  canvas.addEventListener('pointerdown', e => {
    isDragging = true;
    prevMousePos = { x: e.clientX, y: e.clientY };
  });
  canvas.addEventListener('pointerup', () => isDragging = false);
  canvas.addEventListener('pointerleave', () => isDragging = false);
  canvas.addEventListener('pointermove', e => {
    if (!isDragging) return;
    const dx = e.clientX - prevMousePos.x;
    const dy = e.clientY - prevMousePos.y;
    prevMousePos = { x: e.clientX, y: e.clientY };
    const panSpeed = 1;
    camera.position.x -= dx * panSpeed / camera.zoom;
    camera.position.y += dy * panSpeed / camera.zoom;
    userInteracted = true;
  });
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const factor = 1.05;
    camera.zoom *= (e.deltaY < 0 ? factor : 1 / factor);
    camera.zoom = THREE.MathUtils.clamp(camera.zoom, 0.1, 10);
    camera.updateProjectionMatrix();
    userInteracted = true;
  });
}
function createScene(objectsArray) {
  scene = new THREE.Scene();
  const aspect = window.innerWidth / window.innerHeight;
  const frustumSize = 1200;
  camera = new THREE.OrthographicCamera(-frustumSize * aspect / 2, frustumSize * aspect / 2, frustumSize / 2, -frustumSize / 2, -1000, 1000);
  camera.position.set(0, 0, 100);
  camera.lookAt(0, 0, 0);
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);
  labelRenderer = new CSS2DRenderer();
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.domElement.style.position = 'absolute';
  labelRenderer.domElement.style.top = '0';
  labelRenderer.domElement.style.pointerEvents = 'none';
  document.body.appendChild(labelRenderer.domElement);
  const loader = new THREE.TextureLoader();

  objectsArray.forEach(obj => {
    const group = new THREE.Group();
    group.userData = obj;
    if (obj.aura_color) group.add(createAuraCircle(obj.aura_color));
    loader.load(obj.icon_url, tex => {
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
      sprite.scale.set(40, 40, 1);
      sprite.userData.parentGroup = group;
      sprite.name = 'icon';
      sprite.cursor = 'pointer';
      group.add(sprite);
    });
    const labelDiv = document.createElement('div');
    labelDiv.className = 'label clickable';
    labelDiv.textContent = obj.display_name || obj.id;
    labelDiv.addEventListener('click', () => simulateClickOnGroup(group));
    const label = new CSS2DObject(labelDiv);
    label.position.set(0, -30, 0);
    group.add(label);
    scene.add(group);
    objects[obj.id] = group;
    mapObjects.push(group);
  });
}
function animate() {
  requestAnimationFrame(animate);
  const globalTime = getGlobalTimeSeconds();
  Object.values(objects).forEach(group => {
    const obj = group.userData;
    if (!obj._orbitParams && !obj.isCore) {
      obj._orbitParams = generateOrbitParams(obj.seed_id || obj.id);
    }
    if (!obj.isCore) {
      const { radius, angleOffset } = obj._orbitParams;
      const angle = (globalTime / (obj.rotation_cycle_duration || 60)) * 2 * Math.PI + angleOffset;
      group.position.set(radius * Math.cos(angle), radius * Math.sin(angle), 0);
      if (obj.sprite) {
        const spin = (globalTime / 60) * 2 * Math.PI;
        obj.sprite.material.rotation = spin;
      }
    }
  });
  if (followObject && !userInteracted) {
    const target = followObject.position;
    camera.position.x += (target.x - camera.position.x) * 0.1;
    camera.position.y += (target.y - camera.position.y) * 0.1;
    camera.updateProjectionMatrix();
  } else if (followObject && userInteracted) {
    infoBox.style.display = 'none';
    followObject = null;
  }
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function setupSearch() {
  const input = document.getElementById('searchInput');
  const count = document.getElementById('searchCount');
  const next = document.getElementById('searchNext');
  const prev = document.getElementById('searchPrev');
  function updateResults() {
    const q = input.value.toLowerCase();
    searchResults = mapObjects.filter(g => (g.userData.display_name || '').toLowerCase().includes(q));
    currentSearchIndex = 0;
    count.textContent = `${searchResults.length ? 1 : 0}/${searchResults.length}`;
  }
  function goto(index) {
    if (!searchResults.length) return;
    currentSearchIndex = (index + searchResults.length) % searchResults.length;
    count.textContent = `${currentSearchIndex + 1}/${searchResults.length}`;
    simulateClickOnGroup(searchResults[currentSearchIndex]);
  }
  input.addEventListener('input', updateResults);
  next.addEventListener('click', () => goto(currentSearchIndex + 1));
  prev.addEventListener('click', () => goto(currentSearchIndex - 1));
}
window.addEventListener('resize', () => {
  const aspect = window.innerWidth / window.innerHeight;
  const frustumSize = 1200;
  camera.left = -frustumSize * aspect / 2;
  camera.right = frustumSize * aspect / 2;
  camera.top = frustumSize / 2;
  camera.bottom = -frustumSize / 2;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
});
(async () => {
  try {
    const [cycle, config] = await Promise.all([
      fetch('https://theredmineword.github.io/map/map/cycle.json').then(r => r.json()),
      fetch('https://theredmineword.github.io/map/map/config.json').then(r => r.json())
    ]);
    cycleData = cycle.movement;
    config.effects.forEach(eff => {
      const fn = parseEffectFunction(eff.function);
      if (fn) availableEffects[eff.id] = fn;
    });
    const corePos = new THREE.Vector3(...config.core_object.point_zero);
    const validParents = new Set([config.core_object.data.id, ...config.core_object.close_orbit.map(o => o.id)]);
    const elementsUrls = await fetch(config.galaxy.elements).then(r => r.json());
    const elementsArrays = await Promise.all(elementsUrls.map(url => fetch(url).then(r => r.json())));
    const elementsData = elementsArrays.flat().filter(e => e.parent_id && validParents.has(e.parent_id));
    const allObjects = [
      {
        ...config.core_object.data,
        seed_id: config.core_object.data.seed_id || 'core_0001',
        display_name: config.core_object.data.display_name || 'Galactic Core',
        position: corePos,
        rotation_cycle_duration: 0,
        isCore: true
      },
      ...config.core_object.close_orbit.map(o => ({ ...o, isCore: false })),
      ...elementsData.map(o => ({ ...o, isCore: false }))
    ];
    createScene(allObjects);
    setupControls();
    setupClick();
    setupSearch();
    document.getElementById('loadingOverlay')?.classList.add('hidden');
    setTimeout(() => document.getElementById('loadingOverlay')?.remove(), 500);
    animate();
  } catch (e) {
    document.getElementById('loadingOverlay').innerHTML = "Failed to load map data.<br>" + e.message;
    console.error(e);
  }
})();
</script>
</body>
</html>

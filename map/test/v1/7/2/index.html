<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Galaxy Map 2D Orbit + Spin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body, html { margin:0; padding:0; overflow:hidden; background:#000; font-family:sans-serif; }
    #infoBox {
      position: fixed; bottom: 20px; left: 20px;
      background: rgba(0,0,0,0.75); color: #fff;
      padding: 10px 15px; border-radius: 5px;
      font-size: 14px; max-width: 300px;
      display: none; pointer-events: none; user-select: none;
    }
    .label {
      color: white;
      background: rgba(0,0,0,0.6);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
      pointer-events: none;
      user-select: none;
      white-space: nowrap;
      transform-origin: center center;
    }
    .clickable-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      transform-origin: center center;
      cursor: pointer;
    }
    #loadingOverlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.95);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2em;
      z-index: 9999;
      transition: opacity 0.4s;
    }
    #loadingOverlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #searchUI {
      position: fixed; top: 10px; left: 10px;
      background: rgba(0,0,0,0.75);
      color: white;
      padding: 8px;
      border-radius: 6px;
      z-index: 999;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #searchUI input {
      padding: 4px 8px;
    }
    #searchResultCount { font-size: 13px; }
    #searchPrev, #searchNext {
      background: #333;
      color: white;
      border: none;
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>
<div id="loadingOverlay">Loading galaxy map...</div>
<div id="infoBox"></div>
<div id="searchUI">
  <input type="text" id="searchBox" placeholder="Find... (Ctrl+F)">
  <div id="searchResultNav" style="display:none">
    <span id="searchResultCount">0</span>
    <button id="searchPrev">&lt;</button>
    <button id="searchNext">&gt;</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

let camera, scene, renderer, labelRenderer;
let objects = {};
let mapObjects = [];
let clock = new THREE.Clock();
let infoBox = document.getElementById('infoBox');
let followObject = null;
let followStartTime = 0;
let isDragging = false;
let prevMousePos = { x: 0, y: 0 };
const FOLLOW_DURATION = 4000;
let cycleData = { cycle_zero_start_timestamp: 0, cycle_duration_ms: 60000 };
let searchResults = [], searchIndex = 0;

const searchBox = document.getElementById("searchBox");
const resultCount = document.getElementById("searchResultCount");
const resultNav = document.getElementById("searchResultNav");
const prevBtn = document.getElementById("searchPrev");
const nextBtn = document.getElementById("searchNext");

function formatDuration(ms) {
  const minutes = Math.floor(ms / 60000);
  const seconds = ((ms % 60000) / 1000).toFixed(1);
  return `${minutes}m ${seconds}s`;
}

function vecToStr(vec) {
  return `x: ${vec.x.toFixed(1)}, y: ${vec.y.toFixed(1)}, z: ${vec.z.toFixed(1)}`;
}

function simulateClickOnGroup(group) {
  const data = group.userData;
  const durationMs = (data.rotation_cycle_duration || 0) * cycleData.cycle_duration_ms;
  const durationFormatted = data.rotation_cycle_duration ? `${data.rotation_cycle_duration} (${formatDuration(durationMs)} / 360ο)` : '—';
  infoBox.style.display = 'block';
  infoBox.innerHTML = `<strong>${data.display_name || data.id}</strong><br>` +
                      `Position: ${vecToStr(group.position)}<br>` +
                      `Rotation: ${durationFormatted}`;
  followObject = group;
  followStartTime = performance.now();
}

function setupSearch() {
  searchBox.addEventListener('input', () => {
    const val = searchBox.value.trim().toLowerCase();
    searchResults = mapObjects.filter(g => (g.userData.display_name || '').toLowerCase().includes(val));
    searchIndex = 0;
    resultNav.style.display = searchResults.length > 0 ? 'inline-flex' : 'none';
    resultCount.textContent = `${searchResults.length > 0 ? `1 of ${searchResults.length}` : '0 found'}`;
    if (searchResults.length > 0) simulateClickOnGroup(searchResults[0]);
  });
  prevBtn.onclick = () => {
    if (searchResults.length === 0) return;
    searchIndex = (searchIndex - 1 + searchResults.length) % searchResults.length;
    resultCount.textContent = `${searchIndex + 1} of ${searchResults.length}`;
    simulateClickOnGroup(searchResults[searchIndex]);
  };
  nextBtn.onclick = () => {
    if (searchResults.length === 0) return;
    searchIndex = (searchIndex + 1) % searchResults.length;
    resultCount.textContent = `${searchIndex + 1} of ${searchResults.length}`;
    simulateClickOnGroup(searchResults[searchIndex]);
  };
}

function setupControls() {
  const canvas = renderer.domElement;
  canvas.addEventListener('pointerdown', e => {
    isDragging = true;
    prevMousePos = { x: e.clientX, y: e.clientY };
    followObject = null;
    infoBox.style.display = 'none';
  });
  canvas.addEventListener('pointerup', () => isDragging = false);
  canvas.addEventListener('pointerleave', () => isDragging = false);
  canvas.addEventListener('pointermove', e => {
    if (!isDragging) return;
    const dx = e.clientX - prevMousePos.x;
    const dy = e.clientY - prevMousePos.y;
    prevMousePos = { x: e.clientX, y: e.clientY };
    const panSpeed = 1;
    camera.position.x -= dx * panSpeed / camera.zoom;
    camera.position.y += dy * panSpeed / camera.zoom;
    camera.updateProjectionMatrix();
  });
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    followObject = null;
    infoBox.style.display = 'none';
    const factor = 1.05;
    camera.zoom *= (e.deltaY < 0 ? factor : 1 / factor);
    camera.zoom = THREE.MathUtils.clamp(camera.zoom, 0.1, 10);
    camera.updateProjectionMatrix();
  });
}

function createScene(objectsArray) {
  scene = new THREE.Scene();
  const aspect = window.innerWidth / window.innerHeight;
  const frustumSize = 1200;
  camera = new THREE.OrthographicCamera(-frustumSize * aspect / 2, frustumSize * aspect / 2, frustumSize / 2, -frustumSize / 2, -1000, 1000);
  camera.position.set(0, 0, 100);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  labelRenderer = new CSS2DRenderer();
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.domElement.style.position = 'absolute';
  labelRenderer.domElement.style.top = '0';
  labelRenderer.domElement.style.pointerEvents = 'none';
  document.body.appendChild(labelRenderer.domElement);

  const loader = new THREE.TextureLoader();

  objectsArray.forEach(obj => {
    const group = new THREE.Group();
    group.userData = obj;

    const container = new THREE.Group();

    loader.load(obj.icon_url, tex => {
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
      sprite.scale.set(40, 40, 1);
      container.add(sprite);
    });

    const div = document.createElement('div');
    div.className = 'label';
    div.textContent = obj.display_name || obj.id;
    const label = new CSS2DObject(div);
    label.position.set(0, -30, 0);
    container.add(label);

    container.scale.set(1, 1, 1);
    container.cursor = 'pointer';
    container.userData = obj;
    container.onClick = () => simulateClickOnGroup(group);

    group.add(container);
    scene.add(group);
    mapObjects.push(group);
    objects[obj.id] = group;
  });
}

function animate() {
  requestAnimationFrame(animate);
  const globalTime = (Date.now() - cycleData.cycle_zero_start_timestamp) / cycleData.cycle_duration_ms;

  mapObjects.forEach(group => {
    const obj = group.userData;
    if (!obj._orbitParams) {
      const seed = obj.seed_id || obj.id;
      const hash = Array.from(seed).reduce((h, c) => (h << 5) - h + c.charCodeAt(0), 0);
      const coreRadius = 100;
      const minOrbitRadius = coreRadius + 50;
      const maxOrbitRadius = 600;
      const radius = minOrbitRadius + (Math.abs(hash) % (maxOrbitRadius - minOrbitRadius));
      const angleOffset = ((hash >> 8) % 360) * Math.PI / 180;
      obj._orbitParams = { radius, angleOffset };
    }
    if (!obj.isCore) {
      const { radius, angleOffset } = obj._orbitParams;
      const angle = (globalTime / (obj.rotation_cycle_duration || 60)) * 2 * Math.PI + angleOffset;
      group.position.set(radius * Math.cos(angle), radius * Math.sin(angle), 0);
    }
  });

  if (followObject) {
    const t = performance.now() - followStartTime;
    if (t < FOLLOW_DURATION) {
      const target = followObject.position;
      camera.position.x += (target.x - camera.position.x) * 0.1;
      camera.position.y += (target.y - camera.position.y) * 0.1;
      camera.updateProjectionMatrix();
    } else {
      followObject = null;
      infoBox.style.display = 'none';
    }
  }

  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  const aspect = window.innerWidth / window.innerHeight;
  const frustumSize = 1200;
  camera.left = -frustumSize * aspect / 2;
  camera.right = frustumSize * aspect / 2;
  camera.top = frustumSize / 2;
  camera.bottom = -frustumSize / 2;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
});

(async () => {
  const [cycle, config] = await Promise.all([
    fetch('https://theredmineword.github.io/map/map/cycle.json?' + Math.random()).then(r => r.json()),
    fetch('https://theredmineword.github.io/map/map/config.json?' + Math.random()).then(r => r.json())
  ]);

  cycleData = cycle.movement;
  const elementsUrls = await fetch(config.galaxy.elements + '?' + Math.random()).then(r => r.json());
  const elementsArrays = await Promise.all(elementsUrls.map(url => fetch(url + '?' + Math.random()).then(r => r.json())));
  const elementsData = elementsArrays.flat();

  const corePos = new THREE.Vector3(...config.core_object.point_zero);
  const allObjects = [
    { ...config.core_object.data, seed_id: config.core_object.data.seed_id || 'core', display_name: config.core_object.data.display_name || 'Galactic Core', position: corePos, rotation_cycle_duration: 0, isCore: true },
    ...config.core_object.close_orbit.map(o => ({...o, isCore: false})),
    ...elementsData.map(o => ({...o, isCore: false}))
  ];

  createScene(allObjects);
  setupControls();
  setupSearch();
  document.getElementById('loadingOverlay')?.classList.add('hidden');
  setTimeout(() => document.getElementById('loadingOverlay')?.remove(), 500);
  animate();
})();
</script>

</body>
</html>

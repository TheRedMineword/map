<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Galaxy Map 2D Orbit + Spin with Search</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body, html { margin:0; padding:0; overflow:hidden; background:#000; font-family:sans-serif; }
    #searchBox {
      position: fixed; top: 20px; left: 20px;
      z-index: 100;
    }
    #searchBox input {
      padding: 6px 8px;
      font-size: 14px;
      width: 200px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    #infoBox {
      position: fixed; bottom: 20px; left: 20px;
      background: rgba(0,0,0,0.75); color: #fff;
      padding: 10px 15px; border-radius: 5px;
      font-size: 14px; max-width: 300px;
      display: none; pointer-events: none; user-select: none;
    }
    .label {
      color: white;
      background: rgba(0,0,0,0.6);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
      pointer-events: none;
      user-select: none;
      white-space: nowrap;
      transform-origin: center center;
    }
    .label.clickable {
      cursor: pointer;
      pointer-events: auto;
    }
    #loadingOverlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.95);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2em;
      z-index: 9999;
      transition: opacity 0.4s;
    }
    #loadingOverlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div id="loadingOverlay">Loading galaxy map...</div>
<div id="searchBox">
  <input type="text" placeholder="Search galaxy..." id="searchInput"/>
</div>
<div id="infoBox"></div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

let camera, scene, renderer, labelRenderer;
let objects = {}, mapObjects = [];
let infoBox = document.getElementById('infoBox');
let followObject = null, followStartTime = 0;
let isDragging = false, prevMousePos = { x: 0, y: 0 };
const FOLLOW_DURATION = 4000;
let cycleData = { cycle_zero_start_timestamp: 0, cycle_duration_ms: 60000 };

function vecToStr(v){ return `x:${v.x.toFixed(1)}, y:${v.y.toFixed(1)}, z:${v.z.toFixed(1)}`; }
function formatDuration(ms){ const m = Math.floor(ms/60000), s = ((ms%60000)/1000).toFixed(1); return `${m}m ${s}s`; }
function hashStringToNumber(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h<<5)-h+s.charCodeAt(i); h|=0; } return Math.abs(h); }
function generateOrbitParams(seed){
  const h=hashStringToNumber(seed), rMin=150, rMax=600;
  return { radius: rMin + (h % (rMax - rMin)), angleOffset: ((h>>8)%360)*Math.PI/180 };
}
async function fetchJSON(u){ const r=await fetch(u); if(!r.ok) throw 'fetch failed '+u; return r.json(); }
function createAuraCircle(colorHex){
  const canvas=document.createElement('canvas'); canvas.width=128; canvas.height=128;
  const ctx=canvas.getContext('2d');
  const gradient=ctx.createRadialGradient(64,64,0,64,64,64);
  gradient.addColorStop(0, colorHex+"AA"); gradient.addColorStop(1, colorHex+"00");
  ctx.fillStyle=gradient; ctx.fillRect(0,0,128,128);
  const tex=new THREE.CanvasTexture(canvas);
  const mat=new THREE.SpriteMaterial({ map:tex, transparent:true, depthWrite:false });
  const spr=new THREE.Sprite(mat);
  spr.scale.set(100,100,1);
  return spr;
}
function getGlobalTimeSeconds(){ return (Date.now() - cycleData.cycle_zero_start_timestamp)/cycleData.cycle_duration_ms; }

function simulateClickOnGroup(g){
  const d=g.userData;
  const durMs=(d.rotation_cycle_duration||0)*cycleData.cycle_duration_ms;
  const rotStr=d.rotation_cycle_duration?`${d.rotation_cycle_duration} (${formatDuration(durMs)}/360°)`:'—';
  infoBox.style.display='block';
  infoBox.innerHTML=`<strong>${d.display_name||d.id}</strong><br>Position: ${vecToStr(g.position)}<br>Rotation: ${rotStr}`;
  console.log("Clicked map object:", d);
  followObject=g; followStartTime=performance.now();
}

function setupClick(){
  window.addEventListener('click', e=>{
    if(e.target===document.getElementById('searchInput')) return;
    const m=new THREE.Vector2((e.clientX/window.innerWidth)*2-1,-(e.clientY/window.innerHeight)*2+1);
    const rc=new THREE.Raycaster().setFromCamera(m, camera);
    const flies=mapObjects.flatMap(g=>g.children.filter(c=>c instanceof THREE.Sprite));
    const hits=rc.intersectObjects(flies);
    if(hits.length){
      simulateClickOnGroup(hits[0].object.parent);
    }
  });
}

function setupControls(){
  const c=renderer.domElement;
  c.addEventListener('pointerdown',e=>{ isDragging=true; prevMousePos={x:e.clientX,y:e.clientY}; });
  ['pointerup','pointerleave'].forEach(ev=>c.addEventListener(ev,()=>isDragging=false));
  c.addEventListener('pointermove',e=>{
    if(!isDragging)return;
    const dx=e.clientX-prevMousePos.x, dy=e.clientY-prevMousePos.y;
    prevMousePos={x:e.clientX,y:e.clientY};
    camera.position.x-=dx/camera.zoom;
    camera.position.y+=dy/camera.zoom;
    camera.updateProjectionMatrix();
  });
  c.addEventListener('wheel',e=>{
    e.preventDefault();
    const f=1.05;
    camera.zoom*=e.deltaY<0?f:1/f;
    camera.zoom=THREE.MathUtils.clamp(camera.zoom,0.1,10);
    camera.updateProjectionMatrix();
  });
}

function createScene(arr){
  scene=new THREE.Scene();
  const asp=window.innerWidth/window.innerHeight, size=1200;
  camera=new THREE.OrthographicCamera(-size*asp/2, size*asp/2, size/2, -size/2, -1000,1000);
  camera.position.set(0,0,100); camera.lookAt(0,0,0);
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth,window.innerHeight);
  document.body.appendChild(renderer.domElement);
  labelRenderer=new CSS2DRenderer();
  labelRenderer.setSize(window.innerWidth,window.innerHeight);
  labelRenderer.domElement.style.position='absolute';
  labelRenderer.domElement.style.top='0';
  labelRenderer.domElement.style.pointerEvents='none';
  document.body.appendChild(labelRenderer.domElement);

  const loader=new THREE.TextureLoader();
  arr.forEach(o=>{
    const g=new THREE.Group(); g.userData=o;
    if(o.aura_color)g.add(createAuraCircle(o.aura_color));
    loader.load(o.icon_url, tex=>{
      const s=new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, transparent:true }));
      s.scale.set(40,40,1);
      g.add(s); o.sprite=s;
    });
    const div=document.createElement('div');
    div.className='label clickable';
    div.textContent=o.display_name||o.id;
    div.addEventListener('click',()=> simulateClickOnGroup(g));
    const lbl=new CSS2DObject(div);
    lbl.position.set(0,-30,0);
    g.add(lbl);
    scene.add(g);
    objects[o.id]=g;
    mapObjects.push(g);
  });
}

function animate(){
  requestAnimationFrame(animate);
  const t=getGlobalTimeSeconds();
  mapObjects.forEach(g=>{
    const o=g.userData;
    if(!o._orbitParams && !o.isCore) o._orbitParams=generateOrbitParams(o.seed_id||o.id);
    if(!o.isCore){
      const {radius, angleOffset}=o._orbitParams;
      const ang=(t/(o.rotation_cycle_duration||60))*2*Math.PI+angleOffset;
      g.position.set(radius*Math.cos(ang), radius*Math.sin(ang), 0);
      if(o.sprite) o.sprite.material.rotation=(t/60)*2*Math.PI;
    }
    if(g=== followObject && infoBox.style.display==='block'){
      const o2=g.userData;
      const durMs=(o2.rotation_cycle_duration||0)*cycleData.cycle_duration_ms;
      const rotStr=o2.rotation_cycle_duration?`${o2.rotation_cycle_duration} (${formatDuration(durMs)}/360°)`:'—';
      infoBox.innerHTML=`<strong>${o2.display_name||o2.id}</strong><br>Position: ${vecToStr(g.position)}<br>Rotation: ${rotStr}`;
    }
  });
  if(followObject){
    const elapsed=performance.now()-followStartTime;
    if(elapsed<FOLLOW_DURATION){
      camera.position.x += (followObject.position.x - camera.position.x)*0.1;
      camera.position.y += (followObject.position.y - camera.position.y)*0.1;
      camera.updateProjectionMatrix();
    } else followObject=null;
  }
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

window.addEventListener('resize',()=>{
  const asp=window.innerWidth/window.innerHeight, size=1200;
  camera.left=-size*asp/2; camera.right=size*asp/2;
  camera.top=size/2; camera.bottom=-size/2;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
  labelRenderer.setSize(window.innerWidth,window.innerHeight);
});

function setupSearch(){
  const input=document.getElementById('searchInput');
  input.addEventListener('keydown', e=>{
    if(e.key==='Enter'){
      const q=input.value.trim().toLowerCase();
      if(!q) return;
      const found = Object.values(objects).find(g=>{
        const d=g.userData;
        return (d.display_name||d.id).toLowerCase().includes(query);
      });
      if(found){
        simulateClickOnGroup(found);
      }
    }
  });
}

(async()=>{
  try{
    const [cycle, config] = await Promise.all([
      fetchJSON('https://theredmineword.github.io/map/map/cycle.json?' + Math.random()),
      fetchJSON('https://theredmineword.github.io/map/map/config.json?' + Math.random())
    ]);
    cycleData = cycle.movement;
    const corePos = new THREE.Vector3(...config.core_object.point_zero);
    const validParents = new Set([config.core_object.data.id, ...config.core_object.close_orbit.map(o=>o.id)]);
    const elementsUrls=await fetchJSON(config.galaxy.elements);
    const elementsArrs=await Promise.all(elementsUrls.map(u=>fetchJSON(u)));
    const elementsData=elementsArrs.flat().filter(e=>e.parent_id && validParents.has(e.parent_id));
    const allObjs=[
      {
        ...config.core_object.data,
        seed_id:config.core_object.data.seed_id||'core_0001',
        display_name:config.core_object.data.display_name||'Galactic Core',
        position:corePos,
        rotation_cycle_duration:0,
        isCore:true
      },
      ...config.core_object.close_orbit.map(o=>({...o, isCore:false})),
      ...elementsData.map(o=>({...o, isCore:false}))
    ];
    createScene(allObjs);
    setupControls();
    setupClick();
    setupSearch();
    document.getElementById('loadingOverlay').classList.add('hidden');
    setTimeout(()=>document.getElementById('loadingOverlay').remove(), 500);
    animate();
  } catch(e){
    const l=document.getElementById('loadingOverlay');
    l.innerHTML = "Failed to load map data.<br>"+e;
    l.style.color='red';
    console.error(e);
  }
})();
</script>

</body>
</html>

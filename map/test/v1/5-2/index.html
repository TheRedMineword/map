<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Galaxy Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body, html { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: sans-serif; }
    #infoBox {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 10px 15px;
      border-radius: 5px;
      font-size: 14px;
      max-width: 300px;
      display: none;
      pointer-events: none;
      user-select: none;
    }
    .label {
      color: white;
      background: rgba(0, 0, 0, 0.6);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
      pointer-events: none;
      user-select: none;
      white-space: nowrap;
      transform-origin: center center;
    }
    .label.clickable {
      cursor: pointer;
      pointer-events: auto;
    }
    #loadingOverlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.95);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2em;
      z-index: 9999;
      transition: opacity 0.4s;
    }
    #loadingOverlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="loadingOverlay">Loading galaxy map...</div>
  <div id="infoBox"></div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    // Global declarations
    let camera, scene, renderer, labelRenderer;
    let mapObjects = [];
    let followObject = null;
    let followStartTime = 0;
    let isDragging = false;
    let prevMousePos = { x: 0, y: 0 };

    const infoBox = document.getElementById('infoBox');
    const FOLLOW_DURATION = 4000;

    // Vector display formatter
    const vecToStr = vec => `x: ${vec.x.toFixed(1)}, y: ${vec.y.toFixed(1)}, z: ${vec.z.toFixed(1)}`;

    // Load JSON
    async function fetchJSON(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error('Failed to fetch ' + url);
      return await res.json();
    }

    // Scene setup
    function initScene() {
      scene = new THREE.Scene();
      camera = new THREE.OrthographicCamera(
        window.innerWidth / -2, window.innerWidth / 2,
        window.innerHeight / 2, window.innerHeight / -2,
        -1000, 1000
      );
      camera.position.z = 100;
      renderer = new THREE.WebGLRenderer();
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      labelRenderer = new CSS2DRenderer();
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.domElement.style.position = 'absolute';
      labelRenderer.domElement.style.top = '0';
      labelRenderer.domElement.style.pointerEvents = 'none';
      document.body.appendChild(labelRenderer.domElement);
    }

    // Render loop
    function animate() {
      requestAnimationFrame(animate);

      if (followObject) {
        const t = performance.now() - followStartTime;
        if (t < FOLLOW_DURATION) {
          const target = followObject.position;
          camera.position.x += (target.x - camera.position.x) * 0.1;
          camera.position.y += (target.y - camera.position.y) * 0.1;
        } else {
          followObject = null;
        }
      }

      if (followObject) {
        const posStr = vecToStr(followObject.position);
        infoBox.innerHTML = `<strong>${followObject.userData.display_name}</strong><br>Position: ${posStr}`;
      }

      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
    }

    // Load objects
    async function loadGalaxy() {
      const [cycleData, config] = await Promise.all([
        fetchJSON('https://theredmineword.github.io/map/map/cycle.json?' + Math.random()),
        fetchJSON('https://theredmineword.github.io/map/map/config.json?' + Math.random())
      ]);

      const elementsList = await fetchJSON(config.galaxy.elements);
      const allElements = (await Promise.all(elementsList.map(url => fetchJSON(url)))).flat();

      const objectsToRender = [config.core_object.data, ...config.core_object.close_orbit, ...allElements];
      const textureLoader = new THREE.TextureLoader();

      for (const obj of objectsToRender) {
        const group = new THREE.Group();
        group.userData = obj;

        textureLoader.load(obj.icon_url, tex => {
          const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
          sprite.scale.set(40, 40, 1);
          group.add(sprite);
        });

        const labelDiv = document.createElement('div');
        labelDiv.className = 'label clickable';
        labelDiv.textContent = obj.display_name || obj.id;
        labelDiv.addEventListener('click', () => {
          simulateClickOnGroup(group);
        });
        const label = new CSS2DObject(labelDiv);
        label.position.set(0, -30, 0);
        group.add(label);

        group.position.set(
          (Math.random() - 0.5) * 800,
          (Math.random() - 0.5) * 800,
          0
        );

        scene.add(group);
        mapObjects.push(group);
      }
    }

    function simulateClickOnGroup(group) {
      const obj = group.userData;
      followObject = group;
      followStartTime = performance.now();
      infoBox.style.display = 'block';
      console.log("Map Object:", obj);
    }

    // Setup interaction
    function setupControls() {
      const canvas = renderer.domElement;

      canvas.addEventListener('pointerdown', e => {
        isDragging = true;
        prevMousePos = { x: e.clientX, y: e.clientY };
      });
      canvas.addEventListener('pointerup', () => isDragging = false);
      canvas.addEventListener('pointerleave', () => isDragging = false);
      canvas.addEventListener('pointermove', e => {
        if (!isDragging) return;
        const dx = e.clientX - prevMousePos.x;
        const dy = e.clientY - prevMousePos.y;
        camera.position.x -= dx;
        camera.position.y += dy;
        prevMousePos = { x: e.clientX, y: e.clientY };
      });

      canvas.addEventListener('click', (event) => {
        const mouse = new THREE.Vector2(
          (event.clientX / window.innerWidth) * 2 - 1,
          -(event.clientY / window.innerHeight) * 2 + 1
        );

        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(mapObjects.map(g => g.children[0]));

        if (intersects.length > 0) {
          const clicked = intersects[0].object.parent;
          simulateClickOnGroup(clicked);
        }
      });
    }

    window.addEventListener('resize', () => {
      camera.left = window.innerWidth / -2;
      camera.right = window.innerWidth / 2;
      camera.top = window.innerHeight / 2;
      camera.bottom = window.innerHeight / -2;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
    });

    (async () => {
      try {
        initScene();
        await loadGalaxy();
        setupControls();
        animate();
        document.getElementById('loadingOverlay').classList.add('hidden');
      } catch (err) {
        console.error(err);
        document.getElementById('loadingOverlay').innerText = 'Error loading map';
      }
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Starry Sky</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: black;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="starCanvas"></canvas>

<script>
// ===== CONFIG =====
const starsCount = 550;
let starseed = 2137;

// Seeded RNG
function mulberry32(a) {
  return function() {
    let t = (a += 0x6D2B79F5);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
}

let rand = mulberry32(starseed);

// ===== CANVAS & DRAWING =====
const canvas = document.getElementById('starCanvas');
const ctx = canvas.getContext('2d');

function drawStars() {
  const width = window.innerWidth;
  const height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;

  ctx.clearRect(0, 0, width, height);

  // Radial gradient background
  const gradient = ctx.createRadialGradient(width/2, height/2, 0, width/2, height/2, width/1.5);
  gradient.addColorStop(0, '#00111f');
  gradient.addColorStop(1, '#000000');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, width, height);

  // Draw stars
  for (let i = 0; i < starsCount; i++) {
    const x = rand() * width;
    const y = rand() * height;
    const radius = rand() * 1.2 + 0.2;

    const glowRadius = radius * 4;
    const starGradient = ctx.createRadialGradient(x, y, 0, x, y, glowRadius);
    starGradient.addColorStop(0, 'rgba(255,255,255,1)');
    starGradient.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = starGradient;
    ctx.beginPath();
    ctx.arc(x, y, glowRadius, 0, Math.PI*2);
    ctx.fill();

    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI*2);
    ctx.fill();
  }
}

// ===== INITIALIZE & RESIZE =====
function init() {
  rand = mulberry32(starseed); // reset RNG for consistent stars
  drawStars();
}

// Regenerate on resize with throttle
let resizeTimeout;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimeout);
  resizeTimeout = setTimeout(init, 200);
});

// Run on load
init();
</script>
</body>
</html>
